services:
  - type: web
    name: gig-manager-web
    env: docker
    plan: starter
    healthCheckPath: "/up"
    preDeployCommand: "./bin/rails db:migrate"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: SECRET_KEY_BASE
        generateValue: true
      # Optimización de concurrencia y memoria para Render (512 MB RAM):
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      # Reduce la fragmentación de memoria en glibc (evita OOM en contenedores Ruby)
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Ajuste fino de Garbage Collection para mantener el consumo de RAM bajo 250 MB
      - key: RUBY_GC_HEAP_GROWTH_FACTOR
        value: "1.1"
      - key: RUBY_GC_MALLOC_LIMIT
        value: "16777216"
      # Acelera el arranque en frío (cold start) a solo ~10s al evitar re-ejecutar db:prepare en cada encendido
      - key: SKIP_DB_PREPARE_ON_BOOT
        value: "1"
      # Clave para GigAI Copilot (Google Gemini) - configurar en el panel de Render
      - key: GEMINI_API_KEY
        sync: false